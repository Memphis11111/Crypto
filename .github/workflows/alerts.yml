name: Crypto alerts

on:
  schedule:
    - cron: "17 */4 * * *"   # кожні 4 години
  workflow_dispatch:
    inputs:
      test:
        description: "Надіслати тестове повідомлення"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_CONFIG: ${{ secrets.ALERTS_CONFIG }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TEST_MESSAGE: ${{ github.event.inputs.test }}
        run: python3 alerts/check.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alert-state.json
          key: alert-state-${{ github.run_id }}
