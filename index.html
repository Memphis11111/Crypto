<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-base:#131A26;
  --ink-panel:#1B2532;
  --ink-raised:#223040;
  --rule:#2D3C4E;
  --rule-soft:#232F3E;
  --text:#E8EDF2;
  --text-2:#9AAABC;
  --text-3:#66788C;
  --pos:#5FD3A6;
  --neg:#E8735F;
  --gold:#C9A227;
  --gold-dim:#8A7220;
  --defi:#7AA5D2;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --r:10px;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--ink-base);color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--pos)}.neg{color:var(--neg)}.dim{color:var(--text-2)}.faint{color:var(--text-3)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{max-width:1140px;margin:0 auto;padding:0 16px}

/* ---------- Hero / reconciliation ---------- */
.hero{
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,#16202E,var(--ink-base));
  padding:22px 0 20px;margin-bottom:22px;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:600;letter-spacing:.01em}
.brand span{color:var(--text-3);font-weight:400}
.px-state{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.px-state button{
  background:none;border:1px solid var(--rule);color:var(--text-2);
  border-radius:6px;padding:3px 10px;font-size:12px;
}
.px-state button:hover{border-color:var(--gold);color:var(--text)}

.balance{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:16px 0 4px}
.balance .big{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-.02em}
.balance .delta{font-family:var(--mono);font-size:17px;font-weight:500}

/* the reconciliation strip — the one loud element */
.recon{
  display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:0;
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;
  margin-top:16px;background:var(--ink-panel);
}
.recon .cell{padding:12px 16px}
.recon .op{
  display:grid;place-items:center;padding:0 6px;color:var(--text-3);
  font-family:var(--mono);font-size:16px;background:var(--ink-raised);
}
.recon .k{font-size:12px;color:var(--text-2);margin-bottom:3px}
.recon .v{font-family:var(--mono);font-size:19px;font-weight:600}
.recon .kk{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.3}
@media(max-width:760px){
  .recon{grid-template-columns:1fr 1fr;}
  .recon .op{display:none}
  .recon .cell{border-bottom:1px solid var(--rule-soft)}
}

/* ---------- Nav ---------- */
nav{display:flex;gap:2px;margin-bottom:20px;flex-wrap:wrap}
nav button{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text-3);padding:8px 14px;font-weight:500;
}
nav button:hover{color:var(--text-2)}
nav button.on{color:var(--text);border-bottom-color:var(--gold)}

/* ---------- Panels ---------- */
.panel{background:var(--ink-panel);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:18px}
.panel-hd{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--rule-soft);
}
.panel-hd h2{margin:0;font-size:15px;font-weight:600}
.panel-hd .note{font-size:12.5px;color:var(--text-3)}
.panel-hd .grow{flex:1}
.panel-bd{padding:14px 16px}

/* ---------- Tables ---------- */

/* ===== Asset rows (mobile-first, no horizontal scroll) ===== */
.alist{display:flex;flex-direction:column}
.arow{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  gap:12px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--rule-soft);
}
.arow:last-child{border-bottom:none}
.arow:hover{background:rgba(255,255,255,.02)}
.ico{width:34px;height:34px;border-radius:50%;background:var(--ink-raised);object-fit:cover;display:block}
.ico-f{
  width:34px;height:34px;border-radius:50%;background:var(--ink-raised);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;
  color:var(--text-2);font-weight:600;border:1px solid var(--rule);
}
.a-main{min-width:0}
.a-l1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.a-sym{font-weight:700;font-size:15px;letter-spacing:.01em}
.a-qty{font-family:var(--mono);font-size:13px;color:var(--text-2)}
.a-l2{font-family:var(--mono);font-size:13px;color:var(--text-3);margin-top:2px}
.a-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.a-pnl{font-family:var(--mono);font-size:14.5px;font-weight:600}
.a-badge{
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:6px;white-space:nowrap;
}
.a-badge.pos{background:rgba(95,211,166,.13);color:var(--pos)}
.a-badge.neg{background:rgba(232,115,95,.12);color:var(--neg)}
.a-px{font-family:var(--mono);font-size:12.5px;color:var(--text-3)}
@media(max-width:430px){
  .arow{grid-template-columns:32px minmax(0,1fr) auto;gap:9px;padding:11px 12px}
  .ico,.ico-f{width:30px;height:30px}
  .a-sym{font-size:14px}
  .a-qty,.a-l2{font-size:12px}
  .a-pnl{font-size:13.5px}
  .shell{padding:0 10px}
}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{
  text-align:right;font-weight:500;font-size:12px;color:var(--text-3);
  padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;
}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--rule-soft);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.022)}
.sym{font-weight:600}
.sub{font-size:12px;color:var(--text-3);font-weight:400}
tfoot td{border-top:1px solid var(--rule);border-bottom:none;font-weight:600;padding-top:11px}

/* ---------- Buttons / forms ---------- */
.btn{
  background:var(--ink-raised);border:1px solid var(--rule);color:var(--text);
  border-radius:7px;padding:6px 13px;font-size:13.5px;font-weight:500;
}
.btn:hover{border-color:var(--gold-dim)}
.btn.gold{background:var(--gold);color:#17202B;border-color:var(--gold);font-weight:600}
.btn.gold:hover{filter:brightness(1.08)}
.btn.quiet{background:none}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger:hover{border-color:var(--neg);color:var(--neg)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;align-items:end}
.f label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
.f input,.f select{
  width:100%;background:var(--ink-base);border:1px solid var(--rule);
  color:var(--text);border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:13.5px;
}
.f input:focus,.f select:focus{outline:none;border-color:var(--gold)}
.f input::placeholder{color:var(--text-3)}
input[type=date]{color-scheme:dark}

/* ---------- DeFi pool ---------- */
.pool{border:1px solid var(--rule);border-radius:var(--r);margin-bottom:14px;background:var(--ink-panel)}
.pool-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid var(--rule-soft)}
.pool-hd .pair{font-weight:600}
.pool-hd .rng{font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.tag{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--rule);color:var(--text-2)}
.tag.live{color:var(--pos);border-color:rgba(95,211,166,.4);background:rgba(95,211,166,.08)}
.pool-bd{padding:14px 15px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:780px){.pool-bd{grid-template-columns:1fr}}
.leg h4{margin:0 0 9px;font-size:13px;font-weight:600;color:var(--text-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.kv label{font-size:12.5px;color:var(--text-3)}
.kv input{
  background:var(--ink-base);border:1px solid var(--rule);color:var(--text);
  border-radius:5px;padding:5px 8px;font-family:var(--mono);font-size:13px;width:100%;
}
.kv input:focus{outline:none;border-color:var(--gold)}
.pool-out{grid-column:1/-1;border-top:1px solid var(--rule-soft);padding-top:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:11px}
.stat{background:var(--ink-base);border:1px solid var(--rule-soft);border-radius:8px;padding:9px 11px}
.stat .k{font-size:11.5px;color:var(--text-3);margin-bottom:3px}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:600}
.stat .s{font-size:11px;color:var(--text-3);margin-top:2px}

.callout{
  margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13.5px;
  border:1px solid var(--rule);background:var(--ink-base);line-height:1.5;
}
.callout.win{border-color:rgba(95,211,166,.32);background:rgba(95,211,166,.06)}
.callout.lose{border-color:rgba(232,115,95,.3);background:rgba(232,115,95,.05)}
.callout b{font-weight:600}
.callout .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px}

.empty{padding:34px 18px;text-align:center;color:var(--text-3);font-size:14px}
.empty b{display:block;color:var(--text-2);font-weight:600;margin-bottom:5px}

.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}

.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;background:var(--ink-raised);color:var(--text-2);border:1px solid var(--rule-soft)}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
  background:var(--ink-raised);border:1px solid var(--gold-dim);color:var(--text);
  padding:9px 17px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:60;max-width:90vw;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

dialog{
  background:var(--ink-panel);color:var(--text);border:1px solid var(--rule);
  border-radius:12px;padding:0;max-width:520px;width:calc(100vw - 32px);
}
dialog::backdrop{background:rgba(8,12,18,.72)}
dialog .dlg-hd{padding:14px 18px;border-bottom:1px solid var(--rule-soft);font-weight:600}
dialog .dlg-bd{padding:16px 18px}
dialog .dlg-ft{padding:13px 18px;border-top:1px solid var(--rule-soft);display:flex;gap:9px;justify-content:flex-end}
</style>
</head>
<body>

<div class="hero">
  <div class="shell">
    <div class="hero-top">
      <div class="brand">Портфель <span>· спот і DeFi</span></div>
      <div class="px-state">
        <span id="pxInfo">ціни не завантажені</span>
        <button onclick="fetchPrices()">Оновити ціни</button>
      </div>
    </div>
    <div class="balance">
      <span class="big num" id="totVal">—</span>
      <span class="delta num" id="totDelta"></span>
    </div>
    <div class="recon">
      <div class="cell"><div class="k">Заведено ззовні</div><div class="v num" id="rNet">—</div>
        <div class="kk">свої гроші, без реінвесту</div></div>
      <div class="op">→</div>
      <div class="cell"><div class="k">Вкладено з реінвестом</div><div class="v num" id="rInv">—</div>
        <div class="kk">собівартість того, що на руках</div></div>
      <div class="op">→</div>
      <div class="cell"><div class="k">Вартість зараз</div><div class="v num" id="rVal">—</div>
        <div class="kk" id="rDefi"></div></div>
      <div class="op">=</div>
      <div class="cell"><div class="k">Підсумок</div><div class="v num" id="rRes">—</div>
        <div class="kk">від першого дня</div></div>
    </div>
  </div>
</div>

<div class="shell">
  <nav id="nav"></nav>
  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dlg-hd" id="dlgTitle"></div>
  <div class="dlg-bd" id="dlgBody"></div>
  <div class="dlg-ft">
    <button class="btn quiet" onclick="document.getElementById('dlg').close()">Скасувати</button>
    <button class="btn gold" id="dlgOk">Підтвердити</button>
  </div>
</dialog>

<script>
/* ============================================================
   1. STORAGE
   ============================================================ */
const KEY='portfolio_v1';
let S={
  tab:'overview',
  locations:['Біржа','Гаманець'],
  tx:[],        // {id,date,type:buy|sell|reward,sym,qty,price,loc,note}
  pools:[],     // defi positions
  ids:{},       // sym -> coingecko id override
  prices:{},    // sym -> usd
  pxAt:null,
  cgKey:'',
  pxLog:'',
  missing:[],
  actual:{},
  icons:{},
  chg:{}
};

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const r=localStorage.getItem(KEY); if(r){ S=Object.assign(S,JSON.parse(r)); return true; } }catch(e){}
  return false;
}

/* ============================================================
   2. COINGECKO IDS
   ============================================================ */
const CG={
  BTC:'bitcoin',ETH:'ethereum',USDC:'usd-coin',USDT:'tether',HYPE:'hyperliquid',
  SOL:'solana',XRP:'ripple',ADA:'cardano',DOGE:'dogecoin',DOT:'polkadot',
  ATOM:'cosmos',NEAR:'near',APT:'aptos',SUI:'sui',ARB:'arbitrum',OP:'optimism',
  STRK:'starknet',LTC:'litecoin',DASH:'dash',KSM:'kusama',MINA:'mina-protocol',
  CAKE:'pancakeswap-token',UNI:'uniswap',XCH:'chia',DYDX:'dydx-chain',
  EIGEN:'eigenlayer',ZK:'zksync',ZRO:'layerzero',NOT:'notcoin','1INCH':'1inch',
  UMA:'uma',LINK:'chainlink',ONDO:'ondo-finance',TAO:'bittensor',
  INJ:'injective-protocol',JUP:'jupiter-exchange-solana',PEPE:'pepe',
  WIF:'dogwifcoin',BONK:'bonk',AVAX:'avalanche-2',TIA:'celestia',
  ENA:'ethena',RNDR:'render-token',MATIC:'matic-network',
  EOS:'eos',CHZ:'chiliz',STX:'blockstack',MX:'mx-token',QLC:'qlink',
  PROS:'prosper',BSW:'biswap',QMALL:'qmall'
};
const cgId = s => S.ids[s] || CG[s.toUpperCase()] || null;

/* ============================================================
   3. FORMAT
   ============================================================ */
const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x;};
function f(v,d=2){
  if(v===null||v===undefined||isNaN(v))return '—';
  return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function usd(v,d=2){ if(v===null||v===undefined||isNaN(v))return '—'; return (v<0?'−$':'$')+f(Math.abs(v),d); }
function sgn(v,d=2){ if(v===null||isNaN(v))return '—'; return (v>=0?'+$':'−$')+f(Math.abs(v),d); }
function pctS(v){ if(v===null||!isFinite(v))return ''; return (v>=0?'+':'−')+f(Math.abs(v),1)+'%'; }
function k(v){ return v>=0?'pos':'neg'; }
function qf(q){ return Math.abs(q)>=1000?f(q,2):Math.abs(q)>=1?f(q,4):f(q,6); }
const uid=()=>Math.random().toString(36).slice(2,10);

/* ============================================================
   4. ACCOUNTING — weighted average cost basis
   ============================================================ */
function txTime(t){
  if(t.ts!==undefined && t.ts!==null && !isNaN(t.ts)) return +t.ts;
  const d=Date.parse(t.date||''); return isNaN(d)?0:d;
}
function holdings(){
  const H={};
  const rows=S.tx.map((t,i)=>({t,i}))
    .sort((a,b)=>(txTime(a.t)-txTime(b.t)) || (a.i-b.i))
    .map(x=>x.t);
  for(const t of rows){
    const s=(t.sym||'').toUpperCase(); if(!s)continue;
    H[s] = H[s] || {sym:s,qty:0,cost:0,realized:0,byLoc:{}};
    const h=H[s], q=n(t.qty), p=n(t.price), loc=t.loc||'—';
    if(t.type==='sell'){
      const avg = h.qty>0 ? h.cost/h.qty : 0;
      const sold = Math.min(q,h.qty);
      h.realized += sold*(p-avg);
      h.cost -= sold*avg;
      h.qty  -= q;
      h.byLoc[loc]=(h.byLoc[loc]||0)-q;
    }else{ // buy | reward | opening
      h.qty += q; h.cost += q*p;
      h.byLoc[loc]=(h.byLoc[loc]||0)+q;
    }
    if(h.qty>0 && h.qty<1e-9){ h.qty=0; h.cost=0; }   // пил від округлень
  }
  for(const s in H){ H[s].negative = H[s].qty < -1e-9; }
  return H;
}

function poolCalc(p){
  const eIn = n(p.inUsdc)+n(p.inTok)*n(p.inPx);
  const rew = n(p.rUsdc)+n(p.rTok)+n(p.rUni);
  const o={sumIn:eIn,rewards:rew,closed:!!p.closed};
  if(p.closed){
    o.sumOut = n(p.outUsdc)+n(p.outTok)*n(p.outPx);
    o.profit = o.sumOut+rew-eIn;
    const dU=Math.abs(n(p.outUsdc)-n(p.inUsdc)), dT=Math.abs(n(p.inTok)-n(p.outTok));
    o.eff = dT>0?dU/dT:0;
    o.dir = n(p.outTok)<n(p.inTok) ? 'sell' : 'buy';   // pool sold token, or bought more
    o.qtyMoved = dT;
    const d=(new Date(p.outDate)-new Date(p.inDate))/864e5;
    o.days = d>0?d:0;
    o.apr = o.days>0 && eIn>0 ? (rew/eIn)/(o.days/365) : null;
    o.roi = eIn>0 ? o.profit/eIn : null;
    // hold comparison uses current price
    const cur=S.prices[(p.sym||'').toUpperCase()];
    if(cur){
      o.holdTok = n(p.inTok)*cur - n(p.inTok)*n(p.inPx);
      const tokFromSum = n(p.inPx)>0 ? eIn/n(p.inPx) : 0;
      o.holdSum = tokFromSum*cur - eIn;
      o.vsHoldTok = o.profit-o.holdTok;
      o.vsHoldSum = o.profit-o.holdSum;
    }
  }else{
    const cur=S.prices[(p.sym||'').toUpperCase()];
    // для відкритого пулу беремо поточний склад позиції, якщо він заповнений
    const haveCur = (p.curUsdc!=='' && p.curUsdc!=null) || (p.curTok!=='' && p.curTok!=null);
    if(cur!==undefined && haveCur){
      o.liveVal = n(p.curUsdc)+n(p.curTok)*cur;
      o.unclaimed = n(p.rUsdcQty)+n(p.rTokQty)*cur;
    }else if(cur!==undefined){
      o.liveVal = n(p.inUsdc)+n(p.inTok)*cur;
      o.unclaimed = 0;
    }else{ o.liveVal=null; o.unclaimed=0; }
  }
  return o;
}

function totals(){
  const H=holdings();
  let val=0,inv=0,real=0;
  for(const s in H){
    const h=H[s], px=S.prices[s];
    if(px!==undefined && h.qty>0) val += h.qty*px;
    inv += h.cost;
    real += h.realized;
  }
  // Чисто заведено ззовні: угоди за фіат (ext), без внутрішніх обмінів
  let net=0;
  for(const t of S.tx){
    if(!t.ext) continue;
    const v=n(t.qty)*n(t.price);
    net += (t.type==='sell') ? -v : v;
  }

  // Активи, що лежать у відкритих пулах, — це ті самі монети, які вже
  // пораховані у споті (звірка вирівнює кількості). Тому їх не додаємо,
  // а показуємо окремо як частину загального. Незабрані реварди — додаємо.
  let inDefi=0, poolReal=0, unclaimed=0;
  for(const p of S.pools){
    const c=poolCalc(p);
    if(p.closed){ poolReal += c.profit; }
    else{
      if(c.liveVal!==null) inDefi += c.liveVal;
      unclaimed += c.unclaimed||0;
    }
  }
  const totalVal=val+unclaimed;
  return {H,val,inv,real,inDefi,poolReal,unclaimed,net,
          totalVal, totalInv:inv, totalReal:real+poolReal,
          result: totalVal-net};
}

/* ============================================================
   5. PRICES
   ============================================================ */
async function fetchPrices(){
  const syms=new Set();
  Object.entries(holdings()).forEach(([s,h])=>{ if(h.qty>1e-9) syms.add(s); });
  S.pools.forEach(p=>{ if(p.sym) syms.add(p.sym.toUpperCase()); });
  if(!syms.size){ toast('Нема активів для оновлення'); return; }

  const need=[...syms];
  const got={}, log=[];
  // стейбли не питаємо
  need.forEach(s=>{ if(s==='USDC'||s==='USDT'||s==='DAI') got[s]=1; });

  // --- джерело 1: CoinGecko ---
  const map={};
  need.forEach(s=>{ if(got[s]===undefined){ const id=cgId(s); if(id) map[id]=s; } });
  const ids=Object.keys(map);
  if(ids.length){
    let url='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&per_page=250&ids='+ids.join(',');
    if(S.cgKey) url+='&x_cg_demo_api_key='+encodeURIComponent(S.cgKey);
    try{
      const r=await fetch(url);
      if(r.status===429) log.push('CoinGecko: перевищено ліміт запитів (429)');
      else if(!r.ok) log.push('CoinGecko: помилка '+r.status);
      else{
        const d=await r.json(); let k=0;
        S.icons=S.icons||{};
        d.forEach(c=>{
          const s=map[c.id]; if(!s) return;
          if(c.current_price!==null&&c.current_price!==undefined){ got[s]=c.current_price; k++; }
          if(c.image) S.icons[s]=c.image;
          if(c.price_change_percentage_24h!=null){ (S.chg=S.chg||{})[s]=c.price_change_percentage_24h; }
        });
        log.push('CoinGecko: '+k+' цін');
      }
    }catch(e){ log.push('CoinGecko: запит заблоковано (мережа або розширення браузера)'); }
  }

  // --- джерело 2: Coinbase, добираємо те, чого бракує ---
  const miss=need.filter(s=>got[s]===undefined);
  if(miss.length){
    try{
      const r=await fetch('https://api.coinbase.com/v2/exchange-rates?currency=USD');
      if(r.ok){
        const rates=(await r.json()).data.rates; let k=0;
        miss.forEach(s=>{ const v=parseFloat(rates[s]); if(v>0){ got[s]=1/v; k++; } });
        if(k) log.push('Coinbase: '+k+' цін');
      }else log.push('Coinbase: помилка '+r.status);
    }catch(e){ log.push('Coinbase: запит заблоковано'); }
  }

  const found=Object.keys(got).length;
  Object.assign(S.prices,got);
  S.missing=need.filter(s=>got[s]===undefined);
  S.pxLog=log.join(' · ');
  if(found){ S.pxAt=Date.now(); }
  save(); render();
  toast(found?('Оновлено '+found+' з '+need.length+' цін'):'Жодне джерело не відповіло — див. вкладку «Дані»');
}

  const made=[];

               price:+c.eff.toFixed(6),loc:p.loc||'DeFi',note:'пул '+(p.pair||'USDC/'+sym),ext:false});
    made.push((c.dir==='sell'?'продаж ':'купівля ')+qf(c.qtyMoved)+' '+sym);

               loc:p.loc||'DeFi',note:'реварди пулу',ext:false});

function alignQty(sym){

  const act=n((S.actual||{})[sym]);

/* ---- CoinStats CSV ---- */
function csvRows(text){
  const out=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); out.push(row); row=[]; cur=''; }
    else if(ch!=='\r') cur+=ch;
  }
  if(cur||row.length){ row.push(cur); out.push(row); }
  return out.filter(r=>r.some(c=>c.trim()!==''));
}
function csvDate(s){
  const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return today();
  return m[3]+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
}
function csvTs(s){
  const d=Date.parse(String(s).replace(',',''));
  return isNaN(d)?Date.parse(csvDate(s)):d;
}
const DEFI_RE=/пул|pool|ревард|reward|вывел|вийшов/i;

function importCsv(e){
  const file=e.target.files[0]; if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=csvRows(rd.result.replace(/^\uFEFF/,''));
      const head=rows[0].map(h=>h.trim());
      const col=name=>head.indexOf(name);
      const iSym=col('Coin Symbol'), iType=col('Type'), iAmt=col('Amount'),
            iPx=col('Price USD'), iPx2=col('Price'), iEx=col('Exchange'),
            iDate=col('Date'), iNote=col('Notes'), iPair=col('Pair');
      if(iSym<0||iType<0||iAmt<0){ toast('Це не схоже на експорт CoinStats'); return; }
      const tx=[],locs=new Set(S.locations),warn=[];
      for(let i=1;i<rows.length;i++){
        const r=rows[i], sym=(r[iSym]||'').trim().toUpperCase();
        if(!sym) continue;
        const note=(r[iNote]||'').trim();
        const isDefi = (r[iEx]||'').trim()==='Hyperliquid' || DEFI_RE.test(note);
        const loc = isDefi ? 'DeFi' : ((r[iEx]||'').trim() || 'Гаманець');
        locs.add(loc);
        // Price — у валюті пари (напр. 1 USDC = 3.8 ONDO), тому беремо лише Price USD
        const price = n(r[iPx]) || ((r[4]||'').trim().toUpperCase()==='USD' ? n(r[iPx2]) : 0);
        if(!price && (r[iType]||'').trim()==='Buy') warn.push(sym);
        tx.push({id:uid(),date:csvDate(r[iDate]),ts:csvTs(r[iDate]),
          type:(r[iType]||'').trim().toLowerCase()==='sell'?'sell':(DEFI_RE.test(note)&&/ревард|reward/i.test(note)?'reward':'buy'),
          sym, qty:n(r[iAmt]), price, loc, note,
          ext:(r[iPair]||'').trim().toUpperCase()==='USD'});
      }
      if(document.getElementById('csvReplace').checked) S.tx=tx; else S.tx=S.tx.concat(tx);
      S.locations=[...locs];
      save(); render();
      toast(tx.length+' транзакцій імпортовано'+(warn.length?' · '+warn.length+' без ціни':''));
    }catch(err){ toast('Не вдалося прочитати CSV'); }
  };
  rd.readAsText(file); e.target.value='';
}
function wipe(){
  if(!confirm('Видалити всі дані без можливості відновити?'))return;
  localStorage.removeItem(KEY); location.reload();
}

  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('on');

}
