<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-base:#131A26;
  --ink-panel:#1B2532;
  --ink-raised:#223040;
  --rule:#2D3C4E;
  --rule-soft:#232F3E;
  --text:#E8EDF2;
  --text-2:#9AAABC;
  --text-3:#66788C;
  --pos:#5FD3A6;
  --neg:#E8735F;
  --gold:#C9A227;
  --gold-dim:#8A7220;
  --defi:#7AA5D2;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --r:10px;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--ink-base);color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--pos)}.neg{color:var(--neg)}.dim{color:var(--text-2)}.faint{color:var(--text-3)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{max-width:1140px;margin:0 auto;padding:0 16px}

/* ---------- Hero / reconciliation ---------- */
.hero{
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,#16202E,var(--ink-base));
  padding:22px 0 20px;margin-bottom:22px;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:600;letter-spacing:.01em}
.brand span{color:var(--text-3);font-weight:400}
.px-state{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.px-state button{
  background:none;border:1px solid var(--rule);color:var(--text-2);
  border-radius:6px;padding:3px 10px;font-size:12px;
}
.px-state button:hover{border-color:var(--gold);color:var(--text)}

.balance{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:16px 0 4px}
.balance .big{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-.02em}
.balance .delta{font-family:var(--mono);font-size:17px;font-weight:500}

/* the reconciliation strip — the one loud element */
.recon{
  display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:0;
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;
  margin-top:16px;background:var(--ink-panel);
}
.recon .cell{padding:12px 16px}
.recon .op{
  display:grid;place-items:center;padding:0 6px;color:var(--text-3);
  font-family:var(--mono);font-size:16px;background:var(--ink-raised);
}
.recon .k{font-size:12px;color:var(--text-2);margin-bottom:3px}
.recon .v{font-family:var(--mono);font-size:19px;font-weight:600}
.recon .kk{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.3}
@media(max-width:760px){
  .recon{grid-template-columns:1fr 1fr;}
  .recon .op{display:none}
  .recon .cell{border-bottom:1px solid var(--rule-soft)}
}

/* ---------- Nav ---------- */
nav{display:flex;gap:2px;margin-bottom:20px;flex-wrap:wrap}
nav button{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text-3);padding:8px 14px;font-weight:500;
}
nav button:hover{color:var(--text-2)}
nav button.on{color:var(--text);border-bottom-color:var(--gold)}

/* ---------- Panels ---------- */
.panel{background:var(--ink-panel);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:18px}
.panel-hd{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--rule-soft);
}
.panel-hd h2{margin:0;font-size:15px;font-weight:600}
.panel-hd .note{font-size:12.5px;color:var(--text-3)}
.panel-hd .grow{flex:1}
.panel-bd{padding:14px 16px}

/* ---------- Tables ---------- */

/* ===== Asset rows (mobile-first, no horizontal scroll) ===== */
.alist{display:flex;flex-direction:column}
.arow{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  gap:12px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--rule-soft);
}
.arow:last-child{border-bottom:none}
.arow:hover{background:rgba(255,255,255,.02)}
.ico{width:34px;height:34px;border-radius:50%;background:var(--ink-raised);object-fit:cover;display:block}
.ico-f{
  width:34px;height:34px;border-radius:50%;background:var(--ink-raised);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;
  color:var(--text-2);font-weight:600;border:1px solid var(--rule);
}
.a-main{min-width:0}
.a-l1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.a-sym{font-weight:700;font-size:15px;letter-spacing:.01em}
.a-qty{font-family:var(--mono);font-size:13px;color:var(--text-2)}
.a-l2{font-family:var(--mono);font-size:13px;color:var(--text-3);margin-top:2px}
.a-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.a-pnl{font-family:var(--mono);font-size:14.5px;font-weight:600}
.a-badge{
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:6px;white-space:nowrap;
}
.a-badge.pos{background:rgba(95,211,166,.13);color:var(--pos)}
.a-badge.neg{background:rgba(232,115,95,.12);color:var(--neg)}
.a-px{font-family:var(--mono);font-size:12.5px;color:var(--text-3)}
@media(max-width:430px){
  .arow{grid-template-columns:32px minmax(0,1fr) auto;gap:9px;padding:11px 12px}
  .ico,.ico-f{width:30px;height:30px}
  .a-sym{font-size:14px}
  .a-qty,.a-l2{font-size:12px}
  .a-pnl{font-size:13.5px}
  .shell{padding:0 10px}
}

/* ===== Порадник ===== */
.vb{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.vb-buy{background:rgba(95,211,166,.15);color:var(--pos)}
.vb-hold{background:rgba(201,162,39,.15);color:var(--gold)}
.vb-skip{background:var(--ink-raised);color:var(--text-2)}
.vb-exit{background:rgba(232,115,95,.13);color:var(--neg)}
.score{font-size:18px;font-weight:700}
.vsum{display:flex;flex-direction:column;gap:6px}
.advc{border-bottom:1px solid var(--rule-soft)}
.advc:last-child{border-bottom:none}
.advc .arow{border-bottom:none}
.advc.open{background:rgba(255,255,255,.015)}
.advd{padding:0 16px 16px}
.vd{font-size:13px;color:var(--text-2);margin:8px 0 12px}
.pbar{display:grid;grid-template-columns:96px 1fr 30px;gap:9px;align-items:center;margin:5px 0}
.pbar.big{grid-template-columns:1fr;margin:8px 0 0}
.pl{font-size:12px;color:var(--text-3)}
.pt{height:6px;background:var(--ink-raised);border-radius:4px;overflow:hidden;display:block}
.pbar.big .pt{height:8px}
.pf{display:block;height:100%;background:var(--gold);border-radius:4px}
.pf.done{background:var(--pos)}
.pv{font-size:12px;text-align:right;color:var(--text-2)}
.pc{font-size:13px;margin:8px 0;line-height:1.45}
.pc span{font-weight:700;margin-right:4px}
.tg{margin-top:12px;padding:11px 12px;background:var(--ink-base);border:1px solid var(--rule-soft);border-radius:8px}
.lv{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:4px 0}
.lv span:first-child{color:var(--text-3)}
.sig{font-size:13px;padding:8px 11px;border-radius:7px;border:1px solid var(--rule);line-height:1.4}
.sig-exit{border-color:rgba(95,211,166,.4);background:rgba(95,211,166,.07)}
.sig-entry{border-color:rgba(122,165,210,.45);background:rgba(122,165,210,.08)}
.sig-hot{border-color:rgba(201,162,39,.4);background:rgba(201,162,39,.07)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{
  text-align:right;font-weight:500;font-size:12px;color:var(--text-3);
  padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;
}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--rule-soft);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.022)}
.sym{font-weight:600}
.sub{font-size:12px;color:var(--text-3);font-weight:400}
tfoot td{border-top:1px solid var(--rule);border-bottom:none;font-weight:600;padding-top:11px}

/* ---------- Buttons / forms ---------- */
.btn{
  background:var(--ink-raised);border:1px solid var(--rule);color:var(--text);
  border-radius:7px;padding:6px 13px;font-size:13.5px;font-weight:500;
}
.btn:hover{border-color:var(--gold-dim)}
.btn.gold{background:var(--gold);color:#17202B;border-color:var(--gold);font-weight:600}
.btn.gold:hover{filter:brightness(1.08)}
.btn.quiet{background:none}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger:hover{border-color:var(--neg);color:var(--neg)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;align-items:end}
.f label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
.f input,.f select{
  width:100%;background:var(--ink-base);border:1px solid var(--rule);
  color:var(--text);border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:13.5px;
}
.f input:focus,.f select:focus{outline:none;border-color:var(--gold)}
.f input::placeholder{color:var(--text-3)}
input[type=date]{color-scheme:dark}

/* ---------- DeFi pool ---------- */
.pool{border:1px solid var(--rule);border-radius:var(--r);margin-bottom:14px;background:var(--ink-panel)}
.pool-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid var(--rule-soft)}
.pool-hd .pair{font-weight:600}
.pool-hd .rng{font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.tag{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--rule);color:var(--text-2)}
.tag.live{color:var(--pos);border-color:rgba(95,211,166,.4);background:rgba(95,211,166,.08)}
.pool-bd{padding:14px 15px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:780px){.pool-bd{grid-template-columns:1fr}}
.leg h4{margin:0 0 9px;font-size:13px;font-weight:600;color:var(--text-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.kv label{font-size:12.5px;color:var(--text-3)}
.kv input{
  background:var(--ink-base);border:1px solid var(--rule);color:var(--text);
  border-radius:5px;padding:5px 8px;font-family:var(--mono);font-size:13px;width:100%;
}
.kv input:focus{outline:none;border-color:var(--gold)}
.pool-out{grid-column:1/-1;border-top:1px solid var(--rule-soft);padding-top:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:11px}
.stat{background:var(--ink-base);border:1px solid var(--rule-soft);border-radius:8px;padding:9px 11px}
.stat .k{font-size:11.5px;color:var(--text-3);margin-bottom:3px}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:600}
.stat .s{font-size:11px;color:var(--text-3);margin-top:2px}

.callout{
  margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13.5px;
  border:1px solid var(--rule);background:var(--ink-base);line-height:1.5;
}
.callout.win{border-color:rgba(95,211,166,.32);background:rgba(95,211,166,.06)}
.callout.lose{border-color:rgba(232,115,95,.3);background:rgba(232,115,95,.05)}
.callout b{font-weight:600}
.callout .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px}

.empty{padding:34px 18px;text-align:center;color:var(--text-3);font-size:14px}
.empty b{display:block;color:var(--text-2);font-weight:600;margin-bottom:5px}

.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}

.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;background:var(--ink-raised);color:var(--text-2);border:1px solid var(--rule-soft)}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
  background:var(--ink-raised);border:1px solid var(--gold-dim);color:var(--text);
  padding:9px 17px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:60;max-width:90vw;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

dialog{
  background:var(--ink-panel);color:var(--text);border:1px solid var(--rule);
  border-radius:12px;padding:0;max-width:520px;width:calc(100vw - 32px);
}
dialog::backdrop{background:rgba(8,12,18,.72)}
dialog .dlg-hd{padding:14px 18px;border-bottom:1px solid var(--rule-soft);font-weight:600}
dialog .dlg-bd{padding:16px 18px}
dialog .dlg-ft{padding:13px 18px;border-top:1px solid var(--rule-soft);display:flex;gap:9px;justify-content:flex-end}
</style>
</head>
<body>

<div class="hero">
  <div class="shell">
    <div class="hero-top">
      <div class="brand">Портфель <span>· спот і DeFi</span></div>
      <div class="px-state">
        <span id="pxInfo">ціни не завантажені</span>
        <button onclick="fetchPrices()">Оновити ціни</button>
      </div>
    </div>
    <div class="balance">
      <span class="big num" id="totVal">—</span>
      <span class="delta num" id="totDelta"></span>
    </div>
    <div class="recon">
      <div class="cell"><div class="k">Заведено ззовні</div><div class="v num" id="rNet">—</div>
        <div class="kk">свої гроші, без реінвесту</div></div>
      <div class="op">→</div>
      <div class="cell"><div class="k">Вкладено з реінвестом</div><div class="v num" id="rInv">—</div>
        <div class="kk">собівартість того, що на руках</div></div>
      <div class="op">→</div>
      <div class="cell"><div class="k">Вартість зараз</div><div class="v num" id="rVal">—</div>
        <div class="kk" id="rDefi"></div></div>
      <div class="op">=</div>
      <div class="cell"><div class="k">Підсумок</div><div class="v num" id="rRes">—</div>
        <div class="kk">від першого дня</div></div>
    </div>
  </div>
</div>

<div class="shell">
  <nav id="nav"></nav>
  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dlg-hd" id="dlgTitle"></div>
  <div class="dlg-bd" id="dlgBody"></div>
  <div class="dlg-ft">
    <button class="btn quiet" onclick="document.getElementById('dlg').close()">Скасувати</button>
    <button class="btn gold" id="dlgOk">Підтвердити</button>
  </div>
</dialog>

<script>
/* ============================================================
   1. STORAGE
   ============================================================ */
const KEY='portfolio_v1';
let S={
  tab:'overview',
  locations:['Біржа','Гаманець'],
  tx:[],        // {id,date,type:buy|sell|reward,sym,qty,price,loc,note}
  pools:[],     // defi positions
  ids:{},       // sym -> coingecko id override
  prices:{},    // sym -> usd
  pxAt:null,
  cgKey:'',
  pxLog:'',
  missing:[],
  actual:{},
  icons:{},
  chg:{}
};

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const r=localStorage.getItem(KEY); if(r){ S=Object.assign(S,JSON.parse(r)); return true; } }catch(e){}
  return false;
}

/* ============================================================
   2. COINGECKO IDS
   ============================================================ */
const CG={
  BTC:'bitcoin',ETH:'ethereum',USDC:'usd-coin',USDT:'tether',HYPE:'hyperliquid',
  SOL:'solana',XRP:'ripple',ADA:'cardano',DOGE:'dogecoin',DOT:'polkadot',
  ATOM:'cosmos',NEAR:'near',APT:'aptos',SUI:'sui',ARB:'arbitrum',OP:'optimism',
  STRK:'starknet',LTC:'litecoin',DASH:'dash',KSM:'kusama',MINA:'mina-protocol',
  CAKE:'pancakeswap-token',UNI:'uniswap',XCH:'chia',DYDX:'dydx-chain',
  EIGEN:'eigenlayer',ZK:'zksync',ZRO:'layerzero',NOT:'notcoin','1INCH':'1inch',
  UMA:'uma',LINK:'chainlink',ONDO:'ondo-finance',TAO:'bittensor',
  INJ:'injective-protocol',JUP:'jupiter-exchange-solana',PEPE:'pepe',
  WIF:'dogwifcoin',BONK:'bonk',AVAX:'avalanche-2',TIA:'celestia',
  ENA:'ethena',RNDR:'render-token',MATIC:'matic-network',
  EOS:'eos',CHZ:'chiliz',STX:'blockstack',MX:'mx-token',QLC:'qlink',
  PROS:'prosper',BSW:'biswap',QMALL:'qmall'
};
const cgId = s => S.ids[s] || CG[s.toUpperCase()] || null;

/* ============================================================
   3. FORMAT
   ============================================================ */
const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x;};
function f(v,d=2){
  if(v===null||v===undefined||isNaN(v))return '—';
  return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function usd(v,d=2){ if(v===null||v===undefined||isNaN(v))return '—'; return (v<0?'−$':'$')+f(Math.abs(v),d); }
function sgn(v,d=2){ if(v===null||isNaN(v))return '—'; return (v>=0?'+$':'−$')+f(Math.abs(v),d); }
function pctS(v){ if(v===null||!isFinite(v))return ''; return (v>=0?'+':'−')+f(Math.abs(v),1)+'%'; }
function k(v){ return v>=0?'pos':'neg'; }
function qf(q){ return Math.abs(q)>=1000?f(q,2):Math.abs(q)>=1?f(q,4):f(q,6); }
const uid=()=>Math.random().toString(36).slice(2,10);

/* ============================================================
   4. ACCOUNTING — weighted average cost basis
   ============================================================ */
function txTime(t){
  if(t.ts!==undefined && t.ts!==null && !isNaN(t.ts)) return +t.ts;
  const d=Date.parse(t.date||''); return isNaN(d)?0:d;
}
function holdings(){
  const H={};
  const rows=S.tx.map((t,i)=>({t,i}))
    .sort((a,b)=>(txTime(a.t)-txTime(b.t)) || (a.i-b.i))
    .map(x=>x.t);
  for(const t of rows){
    const s=(t.sym||'').toUpperCase(); if(!s)continue;
    H[s] = H[s] || {sym:s,qty:0,cost:0,realized:0,byLoc:{}};
    const h=H[s], q=n(t.qty), p=n(t.price), loc=t.loc||'—';
    if(t.type==='sell'){
      const avg = h.qty>0 ? h.cost/h.qty : 0;
      const sold = Math.min(q,h.qty);
      h.realized += sold*(p-avg);
      h.cost -= sold*avg;
      h.qty  -= q;
      h.byLoc[loc]=(h.byLoc[loc]||0)-q;
    }else{ // buy | reward | opening
      h.qty += q; h.cost += q*p;
      h.byLoc[loc]=(h.byLoc[loc]||0)+q;
    }
    if(h.qty>0 && h.qty<1e-9){ h.qty=0; h.cost=0; }   // пил від округлень
  }
  for(const s in H){ H[s].negative = H[s].qty < -1e-9; }
  return H;
}

function poolCalc(p){
  const sym=(p.sym||'').toUpperCase();
  const live=S.prices[sym];
  const eIn = n(p.inUsdc)+n(p.inTok)*n(p.inPx);
  // ціна, за якою рахуємо поточний/вихідний стан
  const px = p.closed ? n(p.outPx) : live;
  const o={sumIn:eIn,closed:!!p.closed,px};

  if(px===undefined||px===null||!isFinite(px)){
    o.sumOut=null;o.rewards=null;o.liveVal=null;o.unclaimed=0;o.profit=null;o.eff=0;
    return o;
  }
  o.sumOut   = n(p.outUsdc)+n(p.outTok)*px;
  o.unclaimed= n(p.rUsdcQty)+n(p.rTokQty)*px;
  o.rewards  = o.unclaimed;
  o.liveVal  = o.sumOut;

  const dU=Math.abs(n(p.outUsdc)-n(p.inUsdc)), dT=Math.abs(n(p.inTok)-n(p.outTok));
  o.eff = dT>0?dU/dT:0;
  o.dir = n(p.outTok)<n(p.inTok) ? 'sell' : 'buy';
  o.qtyMoved = dT;

  if(p.closed && eIn>0){
    o.profit = o.sumOut+o.rewards-eIn;
    const d=(new Date(p.outDate)-new Date(p.inDate))/864e5;
    o.days = d>0?d:0;
    o.apr = o.days>0 ? (o.rewards/eIn)/(o.days/365) : null;
    o.roi = o.profit/eIn;
    if(live!==undefined){
      o.holdTok = n(p.inTok)*live - n(p.inTok)*n(p.inPx);
      const tokFromSum = n(p.inPx)>0 ? eIn/n(p.inPx) : 0;
      o.holdSum = tokFromSum*live - eIn;
      o.vsHoldTok=o.profit-o.holdTok; o.vsHoldSum=o.profit-o.holdSum;
    }
  }else{
    o.profit = eIn>0 ? o.sumOut+o.rewards-eIn : null;
  }
  return o;
}

function totals(){
  const H=holdings();
  let val=0,inv=0,real=0;
  for(const s in H){
    const h=H[s], px=S.prices[s];
    if(px!==undefined && h.qty>0) val += h.qty*px;
    inv += h.cost;
    real += h.realized;
  }
  // Чисто заведено ззовні: угоди за фіат (ext), без внутрішніх обмінів
  let net=0;
  for(const t of S.tx){
    if(!t.ext) continue;
    const v=n(t.qty)*n(t.price);
    net += (t.type==='sell') ? -v : v;
  }

  // Активи, що лежать у відкритих пулах, — це ті самі монети, які вже
  // пораховані у споті (звірка вирівнює кількості). Тому їх не додаємо,
  // а показуємо окремо як частину загального. Незабрані реварди — додаємо.
  let inDefi=0, poolReal=0, unclaimed=0;
  for(const p of S.pools){
    const c=poolCalc(p);
    if(p.closed){ poolReal += c.profit; }
    else{
      if(c.liveVal!==null) inDefi += c.liveVal;
      unclaimed += c.unclaimed||0;
    }
  }
  const netCalc=net;
  if(S.netOverride!==undefined && S.netOverride!==null && S.netOverride!=='') net=n(S.netOverride);
  // Реварди вже входять у звірені баланси активів, тому зверху не додаються
  const totalVal=val;
  return {H,val,inv,real,inDefi,poolReal,unclaimed,net,netCalc,
          totalVal, totalInv:inv, totalReal:real+poolReal,
          result: totalVal-net};
}

   5. PRICES
   ============================================================ */
async function fetchPrices(){
  const syms=new Set();
  Object.entries(holdings()).forEach(([s,h])=>{ if(h.qty>1e-9) syms.add(s); });
  S.pools.forEach(p=>{ if(p.sym) syms.add(p.sym.toUpperCase()); });
  if(typeof CANDS!=='undefined') CANDS.forEach(s=>syms.add(s));
  if(!syms.size){ toast('Нема активів для оновлення'); return; }

  const need=[...syms];
  const got={}, log=[];
  // стейбли не питаємо
  need.forEach(s=>{ if(s==='USDC'||s==='USDT'||s==='DAI') got[s]=1; });

  // --- джерело 1: CoinGecko ---
  const map={};
  need.forEach(s=>{ if(got[s]===undefined){ const id=cgId(s); if(id) map[id]=s; } });
  const ids=Object.keys(map);
  if(ids.length){
    let url='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&per_page=250&price_change_percentage=30d,1y&ids='+ids.join(',');
    if(S.cgKey) url+='&x_cg_demo_api_key='+encodeURIComponent(S.cgKey);
    try{
      const r=await fetch(url);
      if(r.status===429) log.push('CoinGecko: перевищено ліміт запитів (429)');
      else if(!r.ok) log.push('CoinGecko: помилка '+r.status);
      else{
        const d=await r.json(); let k=0;
        S.icons=S.icons||{};
        d.forEach(c=>{
          const s=map[c.id]; if(!s) return;
          if(c.current_price!==null&&c.current_price!==undefined){ got[s]=c.current_price; k++; }
          if(c.image) S.icons[s]=c.image;
          if(c.price_change_percentage_24h!=null){ (S.chg=S.chg||{})[s]=c.price_change_percentage_24h; }
          const mx=c.max_supply||c.total_supply;
          (S.mkt=S.mkt||{})[s]={rank:c.market_cap_rank,mcap:c.market_cap,vol:c.total_volume,
            circ:(mx&&c.circulating_supply)?c.circulating_supply/mx:null,ath:c.ath,
            ch30:c.price_change_percentage_30d_in_currency,ch1y:c.price_change_percentage_1y_in_currency};
        });
        log.push('CoinGecko: '+k+' цін');
      }
    }catch(e){ log.push('CoinGecko: запит заблоковано (мережа або розширення браузера)'); }
  }

  // --- джерело 2: Coinbase, добираємо те, чого бракує ---
  const miss=need.filter(s=>got[s]===undefined);
  if(miss.length){
    try{
      const r=await fetch('https://api.coinbase.com/v2/exchange-rates?currency=USD');
      if(r.ok){
        const rates=(await r.json()).data.rates; let k=0;
        miss.forEach(s=>{ const v=parseFloat(rates[s]); if(v>0){ got[s]=1/v; k++; } });
        if(k) log.push('Coinbase: '+k+' цін');
      }else log.push('Coinbase: помилка '+r.status);
    }catch(e){ log.push('Coinbase: запит заблоковано'); }
  }

  const found=Object.keys(got).length;
  Object.assign(S.prices,got);
  S.missing=need.filter(s=>got[s]===undefined);
  S.pxLog=log.join(' · ');
  if(found){ S.pxAt=Date.now(); }
  save(); render();
  toast(found?('Оновлено '+found+' з '+need.length+' цін'):'Жодне джерело не відповіло — див. вкладку «Дані»');
}

function vDefi(){
  return `

    `<div class="panel"><div class="empty"><b>Пулів ще немає</b>Додай перший — порахує профіт, APR і порівняє з простим холдом.</div></div>`}`;
}

function poolCard(p,i){
  const c=poolCalc(p);
  const sym=(p.sym||'').toUpperCase();
  const live=S.prices[sym];
  return `
  <div class="pool">
    <div class="pool-hd">
      <span class="pair">${esc(p.pair||'USDC / '+(sym||'?'))}</span>
      <span class="rng">${p.inPx?usd(n(p.inPx),n(p.inPx)<1?4:2):'вхід не вказано'} → ${p.closed?usd(n(p.outPx),n(p.outPx)<1?4:2):(live!==undefined?usd(live,live<1?4:2)+' зараз':'—')}</span>
      <span class="tag ${p.closed?'':'live'}">${p.closed?'закритий':'працює'}</span>
      <div class="grow" style="flex:1"></div>
      <button class="btn sm quiet danger" onclick="delPool(${i})">Видалити</button>
    </div>
    <div class="pool-bd">
      <div class="leg">
        <h4>Вхід у пул</h4>
        <div class="kv">
          <label>Актив</label><input value="${p.sym||''}" onchange="setPool(${i},'sym',this.value.toUpperCase())" placeholder="ETH">
          <label>Ціна</label><input type="number" step="any" value="${p.inPx??''}" onchange="setPool(${i},'inPx',this.value)">
          <label>Дата</label><input type="date" value="${p.inDate||''}" onchange="setPool(${i},'inDate',this.value)">
          <label>USDC</label><input type="number" step="any" value="${p.inUsdc??''}" onchange="setPool(${i},'inUsdc',this.value)">
          <label>${sym||'Токен'}</label><input type="number" step="any" value="${p.inTok??''}" onchange="setPool(${i},'inTok',this.value)">
          <label>Діапазон</label><input value="${p.range||''}" onchange="setPool(${i},'range',this.value)" placeholder="15 – 60">
        </div>
      </div>
      <div class="leg">
        <h4>${p.closed?'Стан на виході':'Зараз у пулі'}</h4>
        <div class="kv">
          <label>USDC</label><input type="number" step="any" value="${p.outUsdc??''}" onchange="setPool(${i},'outUsdc',this.value)">
          <label>${sym||'Токен'}</label><input type="number" step="any" value="${p.outTok??''}" onchange="setPool(${i},'outTok',this.value)">
          <label>Реварди USDC</label><input type="number" step="any" value="${p.rUsdcQty??''}" onchange="setPool(${i},'rUsdcQty',this.value)">
          <label>Реварди ${sym||'токеном'}</label><input type="number" step="any" value="${p.rTokQty??''}" onchange="setPool(${i},'rTokQty',this.value)">
          ${p.closed?`<label>Ціна виходу</label><input type="number" step="any" value="${p.outPx??''}" onchange="setPool(${i},'outPx',this.value)">
          <label>Дата виходу</label><input type="date" value="${p.outDate||''}" onchange="setPool(${i},'outDate',this.value)">`
          :`<label>Ціна</label><input value="${live!==undefined?usd(live,live<1?4:2):'онови ціни'}" disabled style="opacity:.6">`}
        </div>
      </div>
      <div class="pool-out">${p.closed?poolClosed(p,c,i):poolOpen(p,c,i)}</div>
    </div>
  </div>`;
}

function poolOpen(p,c,i){
  const sym=(p.sym||'').toUpperCase();
  const noEntry=!n(p.inUsdc)&&!n(p.inTok);
  return `
  <div class="stats">
    <div class="stat"><div class="k">Вкладено на вході</div><div class="v num">${c.sumIn?usd(c.sumIn):'—'}</div></div>
    <div class="stat"><div class="k">У пулі зараз</div><div class="v num">${c.sumOut!==null?usd(c.sumOut):'—'}</div></div>
    <div class="stat"><div class="k">Незабрані реварди</div><div class="v num ${c.unclaimed?'pos':''}">${c.unclaimed?usd(c.unclaimed):'—'}</div></div>
    <div class="stat"><div class="k">Разом позиція</div><div class="v num">${c.sumOut!==null?usd(c.sumOut+c.unclaimed):'—'}</div></div>
    <div class="stat"><div class="k">Поточний результат</div>
      ${c.profit!==null?`<div class="v num ${k(c.profit)}">${sgn(c.profit)}</div>`:'<div class="v num faint">—</div><div class="s">немає даних входу</div>'}</div>
  </div>
  ${noEntry?`<div class="callout lose"><b>Не заповнені дані входу.</b>
    Впиши ціну, дату, USDC і токен на момент заходу — інакше немає з чим порівнювати.</div>`:''}
  <div class="callout" style="border-color:var(--gold-dim);background:rgba(201,162,39,.06)">
    <b>Закрити пул?</b> Перевір суми вище — вони беруться як стан на виході.
    Ціна і дата підставляться поточні.
    <div class="row"><button class="btn gold" onclick="closePool(${i})">Закрити пул</button></div>
  </div>
  <div class="callout">Монети в пулі та незабрані реварди вже пораховані серед активів —
  тут показано окремо, яка частина портфеля працює в DeFi.</div>`;
}

function poolClosed(p,c,i){
  const sym=(p.sym||'').toUpperCase();
  const win = c.vsHoldSum!==undefined ? c.vsHoldSum>=0 : null;
  return `
  <div class="stats">
    <div class="stat"><div class="k">Результат пулу</div>
      ${c.sumIn>0&&c.profit!==null?`<div class="v num ${k(c.profit)}">${sgn(c.profit)}</div>
        <div class="s">${c.roi!==undefined?pctS(c.roi*100):''} за ${Math.round(c.days||0)} дн</div>`
        :'<div class="v num faint">—</div><div class="s">немає даних входу</div>'}</div>
    <div class="stat"><div class="k">Реварди</div><div class="v num">${c.rewards!==null?usd(c.rewards):'—'}</div></div>
    <div class="stat"><div class="k">Ефективна ціна ${c.dir==='sell'?'продажу':'докупівлі'}</div>
      <div class="v num">${usd(c.eff,c.eff<1?4:2)}</div><div class="s">${qf(c.qtyMoved)} ${sym}</div></div>
    <div class="stat"><div class="k">APR з ревардів</div><div class="v num">${c.apr!==null&&c.apr!==undefined?f(c.apr*100,1)+'%':'—'}</div></div>
  </div>
  ${c.vsHoldSum===undefined?`<div class="callout">Онови ціни, щоб порівняти з холдом.</div>`:`
  <div class="callout ${win?'win':'lose'}">
    <b>${win?'Пул обіграв холд':'Холд був би вигіднішим'}</b> —
    якби просто тримав ті самі ${qf(n(p.inTok))} ${sym}, мав би ${sgn(c.holdTok)};
    якби всю суму ${usd(c.sumIn)} тримав у ${sym} — ${sgn(c.holdSum)}.
    Пул дав ${sgn(c.profit)}, тобто ${c.vsHoldSum>=0?'краще':'гірше'} на ${usd(Math.abs(c.vsHoldSum))}.
    <div class="row">
      <button class="btn" onclick="pushPool(${i})">${p.pushed?'Перенести ще раз':'Перенести в спот-транзакції'}</button>
      <span class="faint" style="font-size:12.5px">${p.pushed?'уже перенесено':'створить '+(c.dir==='sell'?'продаж':'купівлю')+' '+qf(c.qtyMoved)+' '+sym}</span>
    </div>
  </div>`}`;
}

/* ---------- Places ---------- */
function vPlaces(){
  const locVal={};
  for(const sym in (S.placement||{})){
    const px=S.prices[sym]; if(px===undefined) continue;
    for(const L in S.placement[sym]){
      const q=n(S.placement[sym][L]); if(q>0) locVal[L]=(locVal[L]||0)+q*px;
    }
  }
  const ent=Object.entries(locVal).sort((a,b)=>b[1]-a[1]);
  const base=ent.reduce((s,[,v])=>s+v,0);
  return `
  <div class="panel">
    <div class="panel-hd"><h2>Місця зберігання</h2>
      <span class="note">суми беруться з розкладки на сторінках активів</span></div>
    <div class="alist">${ent.map(([L,v])=>`
      <div class="arow" style="grid-template-columns:minmax(0,1fr) auto">
        <div class="a-main"><div class="a-l1"><span class="a-sym">${esc(L)}</span></div>
          <div class="a-l2">${base>0?f(v/base*100,1)+'% портфеля':''}</div></div>
        <div class="a-right"><span class="a-pnl">${usd(v)}</span></div>
      </div>`).join('') || '<div class="empty">Ще нічого не розкладено</div>'}
    </div>
  </div>

  <div class="panel">
    <div class="panel-hd"><h2>Список місць</h2>
      <span class="note">використовується у формах</span></div>
    <div class="panel-bd">
      <div class="form" style="grid-template-columns:1fr auto">
        <div class="f"><input id="newLoc" placeholder="Назва — наприклад Ledger" style="font-family:var(--sans)"></div>
        <div class="f"><button class="btn gold" onclick="addLoc()">Додати</button></div>
      </div>
    </div>
    <div class="alist">${S.locations.map((L,i)=>`
      <div class="arow" style="grid-template-columns:minmax(0,1fr) auto">
        <div class="a-main"><div class="a-l1"><span class="a-sym" style="font-size:14px">${esc(L)}</span></div></div>
        <div class="a-right"><button class="btn sm quiet danger" onclick="delLoc(${i})">Прибрати</button></div>
      </div>`).join('')}
    </div>
  </div>`;
}

function esc(s){ return String(s??'').replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m])); }

function pushPool(i){
  const p=S.pools[i], c=poolCalc(p), sym=(p.sym||'').toUpperCase();
  if(p.pushed && !confirm('Цей пул уже переносили в транзакції. Додати ще раз?')) return;
  const d=p.outDate||today();
  const made=[];
  if(c.qtyMoved>0){
    S.tx.push({id:uid(),date:d,ts:Date.parse(d),type:c.dir==='sell'?'sell':'buy',sym,qty:+c.qtyMoved.toFixed(8),
               price:+c.eff.toFixed(6),loc:p.loc||'DeFi',note:'пул '+(p.pair||'USDC/'+sym),ext:false});
    made.push((c.dir==='sell'?'продаж ':'купівля ')+qf(c.qtyMoved)+' '+sym);
  }
  if(n(p.rTokQty)>0){
    const rp = n(p.rTok)>0 ? n(p.rTok)/n(p.rTokQty) : 0;
    S.tx.push({id:uid(),date:d,ts:Date.parse(d)+1,type:'reward',sym,qty:n(p.rTokQty),price:+rp.toFixed(6),
               loc:p.loc||'DeFi',note:'реварди пулу',ext:false});
    made.push('реварди '+qf(n(p.rTokQty))+' '+sym);
  }
  p.pushed=true; save(); render();
  toast('Додано: '+made.join(', '));
}

function alignQty(sym){
  const h=holdings()[sym]; if(!h) return;
  const act=n((S.actual||{})[sym]);
  const diff=act-h.qty;
  if(Math.abs(diff)<1e-9) return;
  const d=today(), px=S.prices[sym];
  if(diff>0){
    S.tx.push({id:uid(),date:d,ts:Date.parse(d)+2,type:'buy',sym,qty:+diff.toFixed(8),
               price:px!==undefined?px:0,loc:'Гаманець',note:'коригування за фактом',ext:false});
  }else{
    const avg=h.qty>0?h.cost/h.qty:0;
    S.tx.push({id:uid(),date:d,ts:Date.parse(d)+2,type:'sell',sym,qty:+(-diff).toFixed(8),
               price:+avg.toFixed(6),loc:'Гаманець',note:'коригування за фактом (без прибутку)',ext:false});
  }
  save(); render(); toast(sym+': вирівняно на '+qf(Math.abs(diff)));

/* ---- CoinStats CSV ---- */
function csvRows(text){
  const out=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); out.push(row); row=[]; cur=''; }
    else if(ch!=='\r') cur+=ch;
  }
  if(cur||row.length){ row.push(cur); out.push(row); }
  return out.filter(r=>r.some(c=>c.trim()!==''));
}
function csvDate(s){
  const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return today();
  return m[3]+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
}
function csvTs(s){
  const d=Date.parse(String(s).replace(',',''));
  return isNaN(d)?Date.parse(csvDate(s)):d;
}
const DEFI_RE=/пул|pool|ревард|reward|вывел|вийшов/i;

function importCsv(e){
  const file=e.target.files[0]; if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=csvRows(rd.result.replace(/^\uFEFF/,''));
      const head=rows[0].map(h=>h.trim());
      const col=name=>head.indexOf(name);
      const iSym=col('Coin Symbol'), iType=col('Type'), iAmt=col('Amount'),
            iPx=col('Price USD'), iPx2=col('Price'), iEx=col('Exchange'),
            iDate=col('Date'), iNote=col('Notes'), iPair=col('Pair');
      if(iSym<0||iType<0||iAmt<0){ toast('Це не схоже на експорт CoinStats'); return; }
      const tx=[],locs=new Set(S.locations),warn=[];
      for(let i=1;i<rows.length;i++){
        const r=rows[i], sym=(r[iSym]||'').trim().toUpperCase();
        if(!sym) continue;
        const note=(r[iNote]||'').trim();
        const isDefi = (r[iEx]||'').trim()==='Hyperliquid' || DEFI_RE.test(note);
        const loc = isDefi ? 'DeFi' : ((r[iEx]||'').trim() || 'Гаманець');
        locs.add(loc);
        // Price — у валюті пари (напр. 1 USDC = 3.8 ONDO), тому беремо лише Price USD
        const price = n(r[iPx]) || ((r[4]||'').trim().toUpperCase()==='USD' ? n(r[iPx2]) : 0);
        if(!price && (r[iType]||'').trim()==='Buy') warn.push(sym);
        tx.push({id:uid(),date:csvDate(r[iDate]),ts:csvTs(r[iDate]),
          type:(r[iType]||'').trim().toLowerCase()==='sell'?'sell':(DEFI_RE.test(note)&&/ревард|reward/i.test(note)?'reward':'buy'),
          sym, qty:n(r[iAmt]), price, loc, note,
          ext:(r[iPair]||'').trim().toUpperCase()==='USD'});
      }
      if(document.getElementById('csvReplace').checked) S.tx=tx; else S.tx=S.tx.concat(tx);
      S.locations=[...locs];
      save(); render();
      toast(tx.length+' транзакцій імпортовано'+(warn.length?' · '+warn.length+' без ціни':''));
    }catch(err){ toast('Не вдалося прочитати CSV'); }
  };
  rd.readAsText(file); e.target.value='';
}
function wipe(){
  if(!confirm('Видалити всі дані без можливості відновити?'))return;
  localStorage.removeItem(KEY); location.reload();
}

function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2400);
}

function mktOf(s){ return (S.mkt||{})[s] || MKT_SEED[s] || null; }
function techOf(s){ return (S.tech||{})[s] || TECH_SEED[s] || null; }
function vs200Of(s){
  const t=techOf(s), px=S.prices[s];
  if(!t||!t.ma200||px===undefined) return null;
  return (px/t.ma200-1)*100;
}

function advScore(sym){
  const F=FUND[sym], m=mktOf(sym), t=techOf(sym);
  if(!F||!m) return null;
  // тренд: відстань до 200-денної середньої, перетин 50/200 і динаміка за рік
  let tr=50;
  const v=vs200Of(sym);
  if(v!==null){
    let a=clamp(50+v*1.5,0,100)+(t.ma50>t.ma200?10:-10);
    a=clamp(a,0,100);
    const b=m.ch1y!=null?clamp(50+m.ch1y*0.5,0,100):a;
    tr=(a+b)/2;
  }
  const r=m.circ;
  let tk = r==null?50 : r>=0.9?90 : r>=0.75?70 : r>=0.6?50 : r>=0.45?35 : 20;
  tk=clamp(tk+(F.tok||0),0,100);
  const rk=m.rank||999;
  const sz= rk<=20?100 : rk<=50?75 : rk<=100?55 : rk<=300?30 : 10;
  const lr=(m.mcap&&m.vol)?m.vol/m.mcap:0;
  const lq= lr>=0.1?90 : lr>=0.05?70 : lr>=0.02?50 : 30;
  const total=0.30*F.f+0.25*tr+0.20*tk+0.15*sz+0.10*lq;
  return {total:Math.round(total),parts:{fund:F.f,trend:Math.round(tr),tok:tk,size:sz,liq:lq}};
}

  const v=vs200Of(sym);
  if(v!==null && v>50 && (vk==='buy'||vk==='hold'))
    out.push({k:'hot',t:`Ціна на ${Math.round(v)}% вище 200-денної середньої — докуповувати лише частинами`});
  return out;
}

function advPlan(budget){
  const H=holdings(), rows=[];
  for(const sym in FUND){
    if(!H[sym]||H[sym].qty<=1e-9) continue;
    const sc=advScore(sym); if(!sc||sc.total<70) continue;
    const t=techOf(sym); let w=sc.total-60; const why=[];
    if(t&&t.rsi!=null){
      if(t.rsi<=35){ w*=1.3; why.push('перепродана'); }
      else if(t.rsi>=65){ w*=0.6; why.push('перегріта — менше'); }
    }
    const v=vs200Of(sym); if(v!==null&&v>50){ w*=0.7; why.push('далеко від середньої — менше'); }
    rows.push({sym,w,score:sc.total,why});
  }
  rows.sort((a,b)=>b.w-a.w);
  const top=rows.slice(0,4);
  const nc=(typeof candPick==='function')?candPick(top):null;
  if(nc){ if(top.length>=4) top.pop(); nc.isNew=true; top.push(nc); top.sort((a,b)=>b.w-a.w); }
  const W=top.reduce((s,r)=>s+r.w,0);
  if(!W) return [];
  top.forEach(r=>{ r.amt=Math.max(10,Math.round(budget*r.w/W/5)*5); });
  const sum=top.reduce((s,r)=>s+r.amt,0);
  top[0].amt+=budget-sum;
  return top;
}

function advRebalance(){
  const H=holdings(); let total=0,stable=0; const dead=[],dust=[];
  for(const s in H){
    const h=H[s]; if(h.qty<=1e-9) continue;
    const px=S.prices[s]; if(px===undefined) continue;
    const v=h.qty*px; total+=v;
    if(STABLE.has(s)){ stable+=v; continue; }
    const sc=advScore(s);
    if(v<5) dust.push({s,v});
    else if(sc&&sc.total<40) dead.push({s,v,score:sc.total});
  }
  return {total,stable,dead,dust};
}

/* ---- технічні дані: MA200, MA50, RSI — оновлюються у фоні раз на 12 год ---- */
let techBusy=false;
function rsiCalc(cl,n=14){
  if(cl.length<n+1) return null;
  let g=0,l=0;
  for(let i=1;i<=n;i++){ const d=cl[i]-cl[i-1]; g+=Math.max(d,0); l+=Math.max(-d,0); }
  let ag=g/n, al=l/n;
  for(let i=n+1;i<cl.length;i++){ const d=cl[i]-cl[i-1]; ag=(ag*(n-1)+Math.max(d,0))/n; al=(al*(n-1)+Math.max(-d,0))/n; }
  return al===0?100:100-100/(1+ag/al);
}
async function fetchTech(force){
  if(techBusy) return;
  if(!force && Date.now()-(S.techAt||0)<12*3600e3) return;
  techBusy=true;
  const H=holdings();
  const syms=Object.keys(H).filter(s=>H[s].qty>1e-9&&FUND[s]&&cgId(s))
    .concat(typeof CANDS!=='undefined'?CANDS.filter(s=>!(H[s]&&H[s].qty>1e-9)):[]);
  S.tech=S.tech||{}; let done=0, ok=0;
  for(const s of syms){
    for(let a=0;a<2;a++){
      try{
        let u='https://api.coingecko.com/api/v3/coins/'+cgId(s)+'/market_chart?vs_currency=usd&days=220&interval=daily';
        if(S.cgKey) u+='&x_cg_demo_api_key='+encodeURIComponent(S.cgKey);
        const r=await fetch(u);
        if(r.status===429){ await sleep(15000); continue; }
        if(!r.ok) break;
        const cl=(await r.json()).prices.map(p=>p[1]);
        if(cl.length<60) break;
        const last200=cl.slice(-200);
        S.tech[s]={ma200:last200.reduce((x,y)=>x+y,0)/last200.length,
                   ma50:cl.slice(-50).reduce((x,y)=>x+y,0)/50,
                   rsi:rsiCalc(cl.slice(-120)),
                   high90:Math.max(...cl.slice(-90)),low90:Math.min(...cl.slice(-90))};
        ok++; break;
      }catch(e){ break; }
    }
    done++; S.techProg=done+' з '+syms.length; save();
    if(S.tab==='advisor' && !(document.activeElement&&document.activeElement.tagName==='INPUT')) render();
    await sleep(2600);
  }
  if(ok) S.techAt=Date.now();
  S.techProg=''; techBusy=false; save();
  if(S.tab==='advisor'||S.tab.startsWith('asset:')) render();
}

function candSignals(sym){
  const out=[], t=techOf(sym), sc=advScore(sym);
  if(!sc||!t) return out;
  if(FUND[sym].na||FUND[sym].risky) return out;
  if(advVerdict(sc.total)==='buy' && t.rsi!=null && t.rsi<=35)
    out.push({k:'entry',t:`нова монета · RSI ${Math.round(t.rsi)} — перепродана, хороший момент, якщо хочеш додати`});
  return out;
}

function candPick(planRows){
  if(S.candInPlan===false||!planRows.length) return null;
  const weakest=Math.min(...planRows.map(r=>r.w));
  let best=null;
  for(const sym of CANDS){
    if(FUND[sym].na||FUND[sym].risky) continue;
    const sc=advScore(sym); if(!sc||sc.total<70) continue;
    const t=techOf(sym); let w=sc.total-60; const why=['нова монета'];
    if(t&&t.rsi!=null){ if(t.rsi<=35){w*=1.3;why.push('перепродана');} else if(t.rsi>=65){w*=0.6;why.push('перегріта');} }
    const v=vs200Of(sym); if(v!==null&&v>50){w*=0.7;why.push('далеко від середньої');}
    if(w>weakest*1.15 && (!best||w>best.w)) best={sym,w,score:sc.total,why};
  }
  return best;
}
function setCandInPlan(v){ S.candInPlan=v; save(); render(); }


/* ---- налаштування для Telegram-бота ---- */
function telegramConfig(){
  const H=holdings(), coins=[];
  for(const s in H){
    const h=H[s]; if(h.qty<=1e-9||STABLE.has(s)) continue;
    const id=cgId(s); if(!id) continue;
    const px=S.prices[s], val=px!==undefined?h.qty*px:0;
    const tg=(S.targets||{})[s];
    const sc=advScore(s), buy=!!(sc&&advVerdict(sc.total)==='buy');
    if(val<5 && !tg && !buy) continue;           // дрібниці не відстежуємо
    const c={s,id,qty:+h.qty.toPrecision(8)};
    if(h.cost>0) c.avg=+(h.cost/h.qty).toPrecision(8);
    if(tg) c.target=tg;
    if(buy) c.buy=1;
    coins.push(c);
  }
  (typeof CANDS!=='undefined'?CANDS:[]).forEach(s=>{
    if(FUND[s].na||FUND[s].risky||coins.some(c=>c.s===s)) return;
    const sc=advScore(s); if(!sc||sc.total<70) return;
    coins.push({s,id:cgId(s),buy:1,cand:1});
  });
  return {v:1,updated:today(),coins};
}
function copyTgConfig(){
  const txt=JSON.stringify(telegramConfig());
  const box=document.getElementById('tgCfg'); if(box){ box.value=txt; box.style.display='block'; }
  const done=()=>{ S.tgExported=today(); save(); toast('Скопійовано — встав у секрет ALERTS_CONFIG'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>toast('Виділи текст у полі нижче й скопіюй вручну'));
  }else toast('Виділи текст у полі нижче й скопіюй вручну');
}
